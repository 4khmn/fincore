spring.application.name=identity-service
server.port=${SERVER_PORT:8081}

# DataBase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/identity_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml
jwt.secret=${JWT_SECRET:iKnowSheKnowsILikeHerULikeHerMiseryPlayerGameGTA6FireLoveUAllINeedMoreWordsForThisKeyAlsoIWantToSayOHopeIAmRobot}
spring.jpa.hibernate.ddl-auto=validate
